<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkbox</title>
</head>
<body>
    <form action="/server">
        <input type="checkbox" name="age" id="age" checked/>
        <label for="age">I am 18+</label>
        <div>
            <input type="radio" name="fruit" id="apple" value="apple"/>
            <label for="apple">Apple</label>
            <input type="radio" name="fruit" id="mango" value="mango"/>
            <label for="mango">Mango</label>
            <input type="radio" name="fruit" id="orange" value="orange"/>
            <label for="orange">Orange</label>
        </div>
        <br>
        <div>
            Choose your subjects:
            <input type="checkbox" name="subjects" id="math" value="math"/>
            <label for="math">math</label>
            <input type="checkbox" name="subjects" id="science" value="sci"/>
            <label for="science">science</label>
            <input type="checkbox" name="subjects" id="english" value="eng"/>
            <label for="english">english</label>
        </div>
        <div>
            Choose your profession
            <select name="profession" id="profession">
                <option>Select your option</option>
                <option value="stu">Student</option>
                <option value="dev" selected>Developer</option>
            </select>
        </div>
        <label for="vol">Select your label :</label>
        <input type="range" id="vol" min="0" max="100" name="vol" step="10" value="50"/>
        <br>
        <label for="feedback">Please provid your valuable feedback:</label>
        <textarea id="feedback" name="feedback" placeholder="write your feedback here"></textarea>
        <button>Submit</button>
    </form>
</body>
</html>
